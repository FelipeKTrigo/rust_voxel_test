[package]
name = "dungeon_n_evolve"
version = "0.1.0"
edition = "2021"
description = "Dungeon n Evolve — Jogo Voxel Medieval 3D em Rust"

[[bin]]
name = "dungeon_n_evolve"
path = "src/main.rs"

[dependencies]
winit        = "0.30"
wgpu         = "22"
bytemuck     = { version = "1", features = ["derive"] }
glam         = { version = "0.27", features = ["bytemuck"] }
egui         = "0.29"
egui-wgpu    = "0.29"
egui-winit   = "0.29"
noise        = "0.9"
rayon        = "1"
serde        = { version = "1", features = ["derive"] }
bincode      = "1"
log          = "0.4"
env_logger   = "0.11"
anyhow       = "1"
pollster     = "0.3"

[profile.dev]
opt-level = 1          # compilação dev mais rápida mas com otimização básica

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
[dev-dependencies]
naga = { version = "22.1", features = ["wgsl-in"] }
